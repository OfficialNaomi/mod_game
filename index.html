<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mod_game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <header>
      <h1>mod_game</h1>
      <p class="subtitle">Descend the staircase of modular arithmetic</p>
    </header>

    <!-- Main game area: staircase, question, answers, etc. -->
    <main id="game-area">
      <div id="staircase">
        <!-- Steps will be generated by JavaScript -->
      </div>
      <div id="question-panel">
        <p id="question-text">Loading...</p>
        <div id="answer-options">
          <!-- Answer buttons will appear here -->
        </div>
        <div id="feedback"></div>
      </div>
    </main>

    <footer>
      <p>Free Fall unlocks at the bottom.</p>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
