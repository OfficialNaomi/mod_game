<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mod_game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <header>
      <h1>mod_game</h1>
      <p class="subtitle">Descend the staircase of modular arithmetic</p>
    </header>

    <main id="game-area">
      <div id="staircase">
        <!-- Steps will be generated by JavaScript -->
      </div>
      <div id="question-panel">
        <div id="level-info"></div>
        <p id="question-text">Loading...</p>
        <div id="answer-options"></div>
        <div id="feedback"></div>
        <button id="next-level-btn" style="display: none;">Next Level</button>
      </div>
    </main>

    <footer>
      <p>Free Fall unlocks after level 10.</p>
    </footer>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
