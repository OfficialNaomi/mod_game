<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mod_game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="game-container">
  <header>
    <h1>mod_game</h1>
    <p class="subtitle">Descend the spiral of modular arithmetic</p>
  </header>

  <div id="main-layout">
    <aside id="character-panel">
      <div id="character-placeholder">
        <p>Character</p>
        <span id="character-art">🛡️</span>
      </div>

      <div id="stats-display"></div>

      <div id="hp-bar-container">
        <div id="hp-bar"></div>
        <span id="hp-text">HP: 100/100</span>
      </div>

      <div id="xp-bar-container">
        <div id="xp-bar"></div>
        <span id="xp-text">XP: 0/50</span>
      </div>

      <div id="level-display">Level 1</div>

      <div id="inventory-panel">
        <h3>Inventory</h3>
        <div id="inventory-list"></div>
      </div>
    </aside>

    <main id="game-area">
      <div id="staircase-container">
        <div id="staircase"></div>
        <div id="question-panel">
          <div id="level-info"></div>
          <p id="question-text">Loading...</p>
          <div id="answer-options"></div>
          <div id="feedback"></div>
          <div id="button-row">
            <button id="up-btn" disabled>⬆ Up One Step</button>
            <button id="challenge-btn" style="display:none;">⚔️ Challenge the Boss</button>
            <button id="freefall-btn" disabled title="Unlocks after the final boss">Jump to Free Fall</button>
          </div>
        </div>
      </div>

      <div id="freefall-panel" style="display:none;">
        <div id="freefall-header">
          <span id="freefall-timer">30</span>
          <span id="freefall-score">Score: 0</span>
        </div>
        <p id="freefall-question-text">Question</p>
        <div id="freefall-answer-options"></div>
        <div id="freefall-feedback"></div>
        <button id="freefall-retry-btn" style="display:none;">↻ Retry</button>
        <button id="freefall-exit-btn">Return to Stairs</button>
      </div>

      <div id="boss-panel" style="display:none;">
        <div id="boss-header">
          <span id="boss-name">Boss</span>
          <span id="boss-hp-text">HP: 100/100</span>
        </div>
        <div id="boss-hp-bar-container">
          <div id="boss-hp-bar"></div>
        </div>

        <div id="boss-art">👹</div>

        <p id="boss-question-text">Loading...</p>
        <div id="boss-answer-options"></div>
        <div id="boss-feedback"></div>

        <div id="boss-player-status">
          <span id="boss-player-hp">Your HP: 100/100</span>
          <span id="boss-player-atk">ATK: 0</span>
          <span id="boss-player-def">DEF: 0</span>
        </div>

        <div id="boss-button-row">
          <button id="boss-potion-btn">🧪 Use Potion</button>
          <button id="boss-flee-btn">Flee</button>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <p>Defeat the final boss to unlock Free Fall.</p>
  </footer>
</div>

<script src="src/levels.js"></script>
<script src="src/items.js"></script>
<script src="src/gameState.js"></script>
<script src="src/ui.js"></script>
<script src="src/freefall.js"></script>
<script src="src/bosses.js"></script>
<script src="src/boss.js"></script>
<script src="src/main.js"></script>
</body>
</html>
